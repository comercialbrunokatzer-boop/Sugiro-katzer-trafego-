# Site do Tráfego (Katzer OS). Estático (public/) + Netlify Functions.
[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"
  # Netlify injeta o @netlify/blobs no runtime; marca como externo pro bundle não duplicar.
  external_node_modules = ["@netlify/blobs"]

# Health check.
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# API dos botões do Michel.
[[redirects]]
  from = "/api/registrar"
  to = "/.netlify/functions/registrar"
  status = 200
  force = true
[[redirects]]
