# Site do Tráfego (Katzer OS). Estático (public/) + Netlify Functions.
[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"
  # Netlify injeta o @netlify/blobs no runtime; marca como externo pro bundle não duplicar.
  external_node_modules = ["@netlify/blobs"]

[functions.ranking-campanhas]
  # maximum + 7d + 30d pode passar de 10s
  timeout = 26

# Helena Auditora — a cada 15 min (classifica A/B/C/D leads pagos)
[functions.helena-auditora]
  schedule = "*/15 * * * *"
  timeout = 26

# Health check.
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

