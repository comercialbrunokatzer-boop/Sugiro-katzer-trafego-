<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Katzer OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link id="manifest" rel="manifest" href="/manifest-campanhas.webmanifest">
<meta name="theme-color" content="#0f2a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Campanhas">
<link rel="apple-touch-icon" href="/icon-katzer.png">
<style>
  :root{
    --ground:#eef1f0; --panel:#ffffff; --ink:#14252f; --sub:#5c6b74; --hair:#dbe2e0;
    --gold:#a8792a; --sea:#1f6f66;
    --shadow:0 1px 2px rgba(18,34,44,.06),0 10px 30px rgba(18,34,44,.09);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{ --ground:#0d1820; --panel:#14232d; --ink:#e8edeb; --sub:#9fb1b3; --hair:#263742; --gold:#d4ac60; --sea:#4fb3a6; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:clamp(20px,5vw,40px)}
  .eyebrow{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 .5rem}
  h1{font-size:clamp(1.5rem,5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
  .lede{color:var(--sub);margin:.6rem 0 1.6rem}
  .card{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;margin-top:14px;text-decoration:none;color:inherit}
  .card:hover{border-color:var(--sea)}
  .ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:1.4rem;flex:none;background:var(--ground)}
  .t{font-weight:800}.s{font-size:.82rem;color:var(--sub);margin-top:1px}
  .arw{margin-left:auto;color:var(--sea);font-weight:800}
  footer{margin-top:24px;color:var(--sub);font-size:.75rem;text-align:center}
  .status{display:inline-flex;gap:.4rem;align-items:center;font-size:.72rem;color:var(--sub);margin-top:1rem}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--sea)}
  .hint{margin-top:18px;padding:12px 14px;border:1px dashed var(--hair);border-radius:12px;font-size:.82rem;color:var(--sub)}
</style>
</head>
<body>
  <div class="wrap" id="app"></div>
<script>
(function () {
  var host = (location.hostname || '').toLowerCase();
  var isCampanhas = /campanhas-katzer|dashing-elf-41a723/.test(host);
  var el = document.getElementById('app');
  if (isCampanhas) {
    document.title = 'Campanhas Katzer';
    document.getElementById('manifest').href = '/manifest-campanhas.webmanifest';
    el.innerHTML =
      '<p class="eyebrow">Katzer OS · App Campanhas</p>' +
      '<h1>Painel de Campanhas</h1>' +
      '<p class="lede">Aqui o Michel EXECUTA · insights · CPL BOM · Caçador. Rotina é só olhar.</p>' +
      '<a class="card" href="/campanhas"><div class="ic">⬜</div><div><div class="t">Decisão do dia</div><div class="s">Aplicar · Ajustar · Agora não · insights</div></div><div class="arw">▸</div></a>' +
      '<a class="card" href="/campanhas-decisao"><div class="ic">📋</div><div><div class="t">Lista · Bruto / BOM</div><div class="s">Toggle · semáforo · travas · Caçador</div></div><div class="arw">▸</div></a>' +
      '<a class="card" href="/ranking-campanhas"><div class="ic">📈</div><div><div class="t">Ranking</div><div class="s">Form ou WhatsApp · nunca clique</div></div><div class="arw">▸</div></a>' +
      '<a class="card" href="/qualidade"><div class="ic">🎯</div><div><div class="t">Caçador · CPL BOM</div><div class="s">Bom · Curioso · Errado · Comprador</div></div><div class="arw">▸</div></a>' +
      '<a class="card" href="/como-instalar-campanhas"><div class="ic">📲</div><div><div class="t">Instalar este app</div><div class="s">2º ícone no celular do Michel</div></div><div class="arw">▸</div></a>' +
      '<div class="hint">Rotina = olhar resumo. Aqui = pensar e executar (dinheiro).</div>' +
      '<div class="status"><span class="dot"></span> campanhas-katzer · EXECUTA</div>' +
      '<footer>Katzer OS · Campanhas</footer>';
  } else {
    document.title = 'Rotina · Katzer OS';
    document.getElementById('manifest').href = '/manifest.webmanifest';
    document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', 'Placar Michel');
    el.innerHTML =
      '<p class="eyebrow">Katzer OS · Rotina</p>' +
      '<h1>Rotina do Michel</h1>' +
      '<p class="lede">Tarefas do dia. Em Campanhas ele só OLHA o resumo — executar fica no outro app.</p>' +
      '<a class="card" href="/placar-michel"><div class="ic">🗂️</div><div><div class="t">Placar do Michel</div><div class="s">Tocar Feito em cada tarefa</div></div><div class="arw">▸</div></a>' +
      '<a class="card" href="/placar-gestor"><div class="ic">👀</div><div><div class="t">Placar do Gestor</div><div class="s">% ao vivo · Bruno</div></div><div class="arw">▸</div></a>' +
      '<a class="card" href="https://dashing-elf-41a723.netlify.app/"><div class="ic">📊</div><div><div class="t">Abrir Painel de Campanhas</div><div class="s">Lá ele EXECUTA · insights · Caçador</div></div><div class="arw">▸</div></a>' +
      '<div class="hint">Rotina = olhar / fazer tarefas. Campanhas = executar decisão de dinheiro.</div>' +
      '<div class="status"><span class="dot"></span> rotina-produtiva-michel · SÓ OLHAR em Campanhas</div>' +
      '<footer>Katzer OS · Rotina</footer>';
  }
})();
</script>
</body>
</html>
