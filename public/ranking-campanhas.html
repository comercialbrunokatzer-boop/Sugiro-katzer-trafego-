<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ranking · CPL Formulário · Katzer</title>
<meta name="theme-color" content="#0f2a24">
<link rel="manifest" href="/manifest-ranking.webmanifest">
<link rel="apple-touch-icon" href="/icon-katzer.png">
<link rel="icon" type="image/png" href="/icon-katzer.png">
<style>
  :root{
    --bg:#0f2a24; --panel:#16352d; --ink:#eef6f2; --muted:#9bb5ab;
    --line:#2a4a40; --good:#3dba7e; --warn:#d4a017; --bad:#d4655a; --chip:#1e4339;
    --sans:"Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0c221d 0%,#0f2a24 40%,#12332b 100%);
    color:var(--ink);font-family:var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased}
  header{padding:18px 16px 8px;max-width:720px;margin:0 auto}
  .brand{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#c4a35a;font-weight:700}
  h1{margin:6px 0 4px;font-size:1.35rem;line-height:1.2}
  .sub{color:var(--muted);font-size:.85rem;margin:0}
  .tabs{display:flex;gap:8px;padding:12px 16px;max-width:720px;margin:0 auto;position:sticky;top:0;background:rgba(15,42,36,.92);backdrop-filter:blur(8px);z-index:2}
  .tab{flex:1;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:10px 12px;font-weight:700;font-size:.85rem}
  .tab.on{background:#c4a35a;color:#1a1408;border-color:#c4a35a}
  main{max-width:720px;margin:0 auto;padding:4px 16px 40px}
  .totais{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
  .t{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
  .t b{display:block;font-size:1.05rem}
  .t span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  h2{font-size:.95rem;margin:18px 0 8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 8px}
  .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .pos{font-weight:800;color:#c4a35a;min-width:1.6rem}
  .nome{font-weight:700;font-size:.92rem;line-height:1.25}
  .meta{color:var(--muted);font-size:.78rem;margin-top:2px}
  .cpl{font-weight:800;font-size:1.05rem;white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-size:.72rem;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted)}
  .st-Boa{color:var(--good)}.st-Ok{color:#8fd4b0}.st-Cara{color:var(--bad)}
  .st-Amostra{color:var(--warn)}.st-0,.st-Form,.st-Sem,.st-Erro{color:var(--warn)}
  .empty{color:var(--muted);padding:20px 8px;text-align:center}
  .conf{background:#1a3d33;border:1px dashed #3d6a58;border-radius:12px;padding:12px;font-size:.82rem;color:var(--muted);margin-bottom:12px}
  .conf b{color:var(--ink)}
  footer{max-width:720px;margin:0 auto;padding:8px 16px 28px;color:var(--muted);font-size:.72rem;text-align:center}
  .err{color:var(--bad);padding:16px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="brand">Katzer · Tráfego</div>
  <h1>Ranking · CPL BOM</h1>
  <p class="sub" id="subModo">Ordenado por CPL BOM (Bom+Comprador) · fallback form · nunca clique</p>
</header>
  <div class="nav" id="navModo" style="display:flex;gap:8px;padding:0 16px 8px;max-width:720px;margin:0 auto"></div>
  <div class="tabs">
  <button class="tab on" data-p="conta">Conta</button>
  <button class="tab" data-p="7d">7 dias</button>
  <button class="tab" data-p="30d">30 dias</button>
</div>
<main id="app"><div class="empty" id="loadMsg">Carregando Meta…</div></main>
<footer id="ft">Modo seguro · sem token na tela</footer>
<script>
const brl=(v)=>v==null?'—':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const $= (s)=>document.querySelector(s);
let DATA=null, PER='conta';

function stClass(s){
  if(s==='Boa')return 'st-Boa';
  if(s==='Ok')return 'st-Ok';
  if(s==='Cara')return 'st-Cara';
  if(s==='Amostra pequena')return 'st-Amostra';
  return 'st-0';
}

function bloco(titulo, rows, {volume=false}={}){
  if(!rows||!rows.length) return `<h2>${titulo}</h2><div class="empty">Nenhuma campanha neste corte.</div>`;
  return `<h2>${titulo}</h2>`+rows.map(r=>`
    <article class="card">
      <div class="row">
        <div>
          <div class="nome"><span class="pos">${r.pos}º</span> ${r.campanha}</div>
          <div class="meta">${r.cidadeProduto||'—'} · ${r.diasNoAr!=null?(r.diasNoAr+' dia(s)'):'máx. conta'}</div>
        </div>
        <div class="cpl ${stClass(r.status)}">${brl(r.cplBom!=null?r.cplBom:r.cplForm)}</div>
      </div>
      <div class="chips">
        <span class="chip">${r.leadsForm} form.</span>
        ${r.leadsBons!=null?`<span class="chip">${r.leadsBons} BOM</span>`:''}
        <span class="chip">${brl(r.gasto)}</span>
        ${r.cplBom!=null?`<span class="chip">CPL BOM ${brl(r.cplBom)}</span>`:`<span class="chip">CPL form ${brl(r.cplForm)}</span>`}
        <span class="chip ${stClass(r.status)}">${r.veredito||r.status}</span>
        ${volume?'<span class="chip">CPL ≤ R$ 40</span>':''}
      </div>
    </article>`).join('');
}

function pickBlk(){
  if(PER==='conta') return DATA.contaMaxima;
  if(PER==='30d') return DATA.historico30d;
  return DATA.operacional7d;
}

function render(){
  const app=$('#app');
  if(!DATA||!DATA.ok){
    app.innerHTML=`<div class="err">${(DATA&&DATA.erro)||'Dados da Meta indisponíveis.'}<br><button class="tab" style="margin-top:12px;display:inline-block;width:auto;padding:10px 18px" id="btnRetry">Tentar de novo</button></div>`;
    const b=$('#btnRetry'); if(b) b.onclick=()=>load();
    return;
  }
  const blk = pickBlk();
  if(!blk||!blk.ok){
    app.innerHTML=`<div class="err">${(blk&&blk.erro)||'Dados da Meta indisponíveis.'}<br><button class="tab" style="margin-top:12px;display:inline-block;width:auto;padding:10px 18px" id="btnRetry2">Tentar de novo</button></div>`;
    const b=$('#btnRetry2'); if(b) b.onclick=()=>load();
    return;
  }
  const t=blk.totais||{};
  const conf=DATA.conferencia;
  let confHtml='';
  if(conf && PER==='conta'){
    confHtml=`<div class="conf"><b>Ranking real da conta</b> (preset maximum)<br>
      Gasto API: ${brl(conf.totalGastoConta)} · ref. rodapé Gerenciador ${brl(conf.refRodapeGerenciador)}
      · ${conf.bateRodapeAprox?'✅':'⚠️'} ${conf.notaRodape||''}<br>
      Top tem Barra View: ${conf.topTemBarraView?'sim':'não'} · Alicerce: ${conf.topTemAlicerce?'sim':'não'}
      </div>`;
  }
  if(conf && PER==='7d'){
    const br=conf.brSc7d;
    confHtml=`<div class="conf"><b>Conferência BR_SC (7d):</b> API ${br?.leads??'—'} form. · ref. 9
      · ${conf.notaBrSc||''}</div>`;
  }
  const rowsBom = (blk.top10CplBom && blk.top10CplBom.length) ? blk.top10CplBom : ((blk.rankingCplBom||blk.top10Cpl||blk.rankingCpl||[]).slice(0,10));
  app.innerHTML = confHtml + `
    <div class="totais">
      <div class="t"><span>Gasto</span><b>${brl(t.totalGasto)}</b></div>
      <div class="t"><span>Leads form.</span><b>${t.totalLeadsForm??0}</b></div>
      <div class="t"><span>CPL méd.</span><b>${brl(t.cplMedioForm)}</b></div>
    </div>
    ${bloco('TOP 10 · melhor CPL BOM', rowsBom)}
    ${bloco('Volume com CPL saudável (≤ R$ 40)', blk.rankingVolumeCpl, {volume:true})}
    ${blk.amostraPequena?.length?bloco('Amostra pequena (&lt; 3 leads)', blk.amostraPequena.slice(0,5)):''}
  `;
  $('#ft').textContent = `${blk.periodo} · leitura ${blk.horarioLeitura||'—'} · ranking por CPL BOM · ${blk.conta||''}`;
}

const API_BASE=/campanhas-katzer|dashing-elf-41a723/i.test(location.hostname)?'https://rotina-produtiva-michel.netlify.app':'';
const api=(path)=>API_BASE+path;
const IS_EXECUTA=/campanhas-katzer|dashing-elf-41a723/i.test(location.hostname);
const EXEC_URL='https://dashing-elf-41a723.netlify.app';
const FETCH_MS=28000;

(function modoNav(){
  const sub=$('#subModo');
  const nav=$('#navModo');
  if(IS_EXECUTA){
    sub.textContent='App EXECUTA · formulário/WhatsApp · nunca clique';
    nav.innerHTML=
      '<a href="/campanhas" style="flex:1;text-align:center;text-decoration:none;color:#9bb5ab;border:1px solid #2a4a40;border-radius:999px;padding:8px;font-size:.78rem;font-weight:700">Decisão</a>'+
      '<a href="/ranking-campanhas" style="flex:1;text-align:center;text-decoration:none;color:#1a1408;background:#c4a35a;border-radius:999px;padding:8px;font-size:.78rem;font-weight:700">Ranking</a>'+
      '<a href="/qualidade" style="flex:1;text-align:center;text-decoration:none;color:#9bb5ab;border:1px solid #2a4a40;border-radius:999px;padding:8px;font-size:.78rem;font-weight:700">Caçador</a>';
  } else {
    sub.textContent='👁 Disciplina · visualizar · lead form. · nunca clique';
    nav.innerHTML=
      '<a href="/ranking-campanhas" style="flex:1;text-align:center;text-decoration:none;color:#1a1408;background:#c4a35a;border-radius:999px;padding:8px;font-size:.78rem;font-weight:700">Ranking</a>'+
      '<a href="'+EXEC_URL+'/campanhas" style="flex:1;text-align:center;text-decoration:none;color:#c4a35a;border:1px solid #c4a35a;border-radius:999px;padding:8px;font-size:.78rem;font-weight:700">▶ Executar</a>';
  }
})();

async function load(){
  const app=$('#app');
  app.innerHTML=`<div class="empty" id="loadMsg">Carregando Meta…</div>`;
  let tip=null;
  tip=setTimeout(()=>{
    const m=$('#loadMsg');
    if(m) m.textContent='Ainda buscando Meta… (~5–15s na 1ª vez)';
  },3500);
  const ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  const to=setTimeout(()=>{ try{ctrl&&ctrl.abort();}catch(_){} }, FETCH_MS);
  try{
    const r=await fetch(api('/api/ranking-campanhas'), ctrl?{signal:ctrl.signal}:undefined);
    if(!r.ok) throw new Error('HTTP '+r.status);
    DATA=await r.json();
    if(!DATA||DATA.ok===false) DATA={ok:false,erro:(DATA&&DATA.erro)||'Dados da Meta indisponíveis.'};
  }catch(e){
    const abort=e&&(e.name==='AbortError'||/abort/i.test(String(e.message||'')));
    DATA={ok:false,erro:abort?'Demorou demais · toque em Tentar de novo':'Dados da Meta indisponíveis.'};
  }finally{
    clearTimeout(to); if(tip) clearTimeout(tip);
  }
  render();
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); PER=b.dataset.p;
  if(DATA&&DATA.ok) render(); else load();
}));
load();
</script>
</body>
</html>
