<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>O quadradinho do Michel — Campanhas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest-placar.webmanifest">
<meta name="theme-color" content="#0d1820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Placar Michel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icon-katzer.png">
<link rel="icon" type="image/png" href="/icon-katzer.png">
<style>
  :root{
    --ground:#0d1820;--panel:#14232d;--ink:#e8edeb;--sub:#9fb1b3;--hair:#263742;
    --gold:#d4ac60;--sea:#1f6f66;--sea2:#4fb3a6;--ok:#43c07d;--ok-bg:#14342a;
    --late:#e0765c;--late-bg:#331f1a;--warn:#e0ab3f;--warn-bg:#33290f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:420px;margin:0 auto;padding:18px 16px 40px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .k{width:36px;height:36px;border-radius:50%;background:linear-gradient(150deg,var(--sea),#134f49);display:grid;place-items:center;font-weight:800;color:#fff}
  .brand .t{font-weight:800;font-size:.95rem}.brand .s{font-size:.72rem;color:var(--sub)}
  .card{background:var(--panel);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-top:12px}
  .card h2{margin:0 0 10px;font-size:1.05rem;font-weight:800}
  .badge{float:right;font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sea2);border:1px solid var(--hair);border-radius:999px;padding:3px 8px}
  .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair)}
  .row:last-child{border-bottom:0}
  .row .nm{flex:1;min-width:0;font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .val{font-size:.82rem;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .dot.red{background:var(--late)}.dot.green{background:var(--ok)}.dot.gray{background:var(--sub)}
  .camp-block{border-bottom:1px solid var(--hair);padding:8px 0}
  .camp-block:last-child{border-bottom:0}
  .camp-actions{display:none;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
  .camp-block.open .camp-actions{display:grid}
  .camp-actions button{border:1px solid var(--hair);background:var(--ground);color:var(--ink);border-radius:10px;padding:10px 6px;font-size:.72rem;font-weight:800;font-family:inherit;cursor:pointer}
  .camp-actions .d{border-color:rgba(224,118,92,.45)}.camp-actions .m{border-color:rgba(159,177,179,.45)}.camp-actions .a{border-color:rgba(67,192,125,.45)}
  .camp-val{display:none;margin-top:8px}
  .camp-block.open.aumentar .camp-val{display:block}
  .camp-val input{width:100%;border:1px solid var(--hair);background:var(--ground);color:var(--ink);border-radius:10px;padding:10px;font-size:.9rem;font-family:inherit}
  .camp-val button{margin-top:6px;width:100%;border:0;background:var(--sea);color:#fff;border-radius:10px;padding:10px;font-weight:800;font-family:inherit;cursor:pointer}
  .camp-done{font-size:.72rem;color:var(--ok);font-weight:700;margin-top:6px}
  .hm{text-align:right;color:var(--sub);font-size:.72rem;margin-top:8px;font-variant-numeric:tabular-nums}
  .btn-open{display:block;width:100%;margin-top:12px;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:.95rem;font-family:inherit;cursor:pointer;background:linear-gradient(150deg,var(--sea),#134f49);color:#fff}
  .sug{background:rgba(67,192,125,.12);border:1px solid rgba(67,192,125,.35);border-radius:12px;padding:12px 14px;margin:10px 0}
  .sug .lab{font-size:.65rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);margin-bottom:4px}
  .sug .tit{font-weight:800;font-size:.95rem}
  .sug .mot{font-size:.8rem;color:var(--sub);margin-top:6px}
  .actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .act{border:1px solid var(--hair);background:var(--ground);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;font-family:inherit;color:var(--ink)}
  .act .ic{font-size:1.2rem;display:block;margin-bottom:4px}
  .act b{display:block;font-size:.78rem}
  .act small{display:block;font-size:.62rem;color:var(--sub);margin-top:3px;line-height:1.2}
  .act.ok{border-color:rgba(67,192,125,.5)}.act.warn{border-color:rgba(224,171,63,.5)}.act.no{border-color:rgba(224,118,92,.5)}
  .valor{margin-top:12px}
  .valor label{display:block;font-size:.65rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:6px}
  .valor input{width:100%;border:1px solid var(--hair);background:var(--ground);color:var(--ink);border-radius:10px;padding:12px;font-size:.95rem;font-family:inherit}
  .okbox{text-align:center;padding:18px 8px}
  .okbox .big{font-size:2.2rem;margin-bottom:6px}
  .okbox b{font-size:1.1rem}
  .okbox p{color:var(--sub);font-size:.85rem;margin:8px 0 0}
  .mini{margin-top:14px;background:var(--ground);border:1px solid var(--hair);border-radius:12px;padding:12px;font-size:.8rem;color:var(--sub);text-align:left}
  .mini b{color:var(--ink)}
  .ghost{margin-top:12px;border:1px solid var(--hair);background:transparent;color:var(--sub);border-radius:10px;padding:10px;width:100%;font-weight:700;font-family:inherit;cursor:pointer}
  .empty{color:var(--sub);font-size:.85rem;text-align:center;padding:12px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#e8edeb;color:#0d1820;padding:11px 18px;border-radius:999px;font-weight:700;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  footer{margin-top:18px;color:var(--sub);font-size:.7rem;text-align:center}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="k">K</div>
    <div><div class="t">Katzer OS</div><div class="s">Analista de Campanha</div></div>
  </div>

  <!-- QUADRADO 1: Campanhas — hoje -->
  <div class="card" id="cardCamp">
    <h2>📊 Campanhas — hoje</h2>
    <div id="lista"></div>
    <div class="hm" id="hm">—</div>
    <button class="btn-open" id="btnAbrir">▶ Abrir decisão do dia</button>
  </div>

  <!-- QUADRADO 2: Decisão do dia -->
  <div class="card hide" id="cardDec">
    <span class="badge">1 toque</span>
    <h2>Decisão do dia</h2>
    <div id="decBody"></div>
  </div>

  <footer>Modo seguro: registra a decisão · você aplica na Meta</footer>
</div>
<div class="toast" id="toast"></div>

<script>
const $=(s)=>document.querySelector(s);
let ST=null, VIEW='lista'; // lista | decisao | feito
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
const brl=(v)=>v==null?'—':'R$ '+Number(v).toLocaleString('pt-BR',{maximumFractionDigits:0});
const brl2=(v)=>v==null?'—':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

async function load(){
  try{
    const r=await fetch('/api/placar-estado');
    ST=await r.json();
    render();
  }catch(e){toast('Sem conexão');}
}

function corDot(c){
  if((c.leads||0)===0 && (c.gasto||0)>=50) return 'red';
  if((c.leads||0)>0) return 'green';
  return 'gray';
}
function linhaVal(c){
  if(c.cpl!=null) return `${brl(c.cpl)}/lead · ${c.leads}`;
  if((c.leads||0)===0) return `${brl(c.gasto)} · 0 lead`;
  return `${brl(c.gasto)} · ${c.leads} lead`;
}

function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48)||'x';}
function decCampanha(nome){
  const id='camp-'+slug(nome);
  return (ST.decisoes||[]).find(d=>d.id===id)||null;
}

function renderLista(){
  const box=$('#lista');box.innerHTML='';
  const camps=(ST.placar&&ST.placar.campanhas)||[];
  if(!camps.length){box.innerHTML='<div class="empty">Sem campanha com gasto no período.</div>';}
  else camps.slice(0,8).forEach(c=>{
    const done=decCampanha(c.nome);
    const wrap=document.createElement('div');wrap.className='camp-block';
    wrap.innerHTML=`
      <div class="row" style="border:0;padding:0;cursor:pointer">
        <div class="nm">${c.nome}</div>
        <div class="val">${linhaVal(c)}</div>
        <div class="dot ${corDot(c)}"></div>
      </div>
      ${done?`<div class="camp-done">✓ ${done.decisao}${done.ajuste?' · '+done.ajuste:''} · ${done.hora||''}</div>`:''}
      <div class="camp-actions">
        <button class="d" data-cdec="desistir">Desistir</button>
        <button class="m" data-cdec="manter">Manter</button>
        <button class="a" data-cdec="aumentar">Aumentar</button>
      </div>
      <div class="camp-val">
        <input placeholder="Novo valor/dia · ex: R$ 80">
        <button data-conf-aumen>Confirmar aumento</button>
      </div>`;
    const head=wrap.querySelector('.row');
    head.addEventListener('click',()=>{
      document.querySelectorAll('.camp-block').forEach(x=>{if(x!==wrap){x.classList.remove('open','aumentar');}});
      wrap.classList.toggle('open');
      wrap.classList.remove('aumentar');
    });
    wrap.querySelectorAll('[data-cdec]').forEach(b=>{
      b.addEventListener('click',async(ev)=>{
        ev.stopPropagation();
        const dec=b.dataset.cdec;
        if(dec==='aumentar'){wrap.classList.add('aumentar');wrap.querySelector('.camp-val input').focus();return;}
        await postCampanha(c.nome,dec,'');
      });
    });
    const conf=wrap.querySelector('[data-conf-aumen]');
    conf.addEventListener('click',async(ev)=>{
      ev.stopPropagation();
      const val=wrap.querySelector('.camp-val input').value.trim();
      if(!val){toast('Digite o novo valor');return;}
      await postCampanha(c.nome,'aumentar',val);
    });
    box.appendChild(wrap);
  });
  $('#hm').textContent=ST.ultimaLeitura||ST.agora||'';
}

async function postCampanha(nome,decisao,ajuste){
  const id='camp-'+slug(nome);
  const r=await fetch('/api/placar-registrar',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({acao:'decisao',id,campanha:nome,tipo:'campanha',decisao,ajuste})
  }).then(x=>x.json()).catch(()=>({ok:false}));
  if(r.ok){toast('Registrado · Bruno avisado');await load();}
  else toast(r.erro||'Não deu');
}

function jaDecidiuPrincipal(){
  const s=ST.sugestaoPrincipal;if(!s)return null;
  return (ST.decisoes||[]).find(d=>d.id===s.id)||null;
}

function renderDecisao(){
  const body=$('#decBody');
  const s=ST.sugestaoPrincipal;
  const done=jaDecidiuPrincipal();

  if(done){
    const rot=done.decisao==='aplicar'?'Aplicou':done.decisao==='ajustar'?'Ajustou':'Agora não';
    body.innerHTML=`
      <div class="okbox">
        <div class="big">✅</div>
        <b>Registrado ✅</b>
        <p>Sua decisão ficou anotada. Agora é só aplicar na Meta.</p>
      </div>
      <div class="mini">No seu relatório: <b>Michel ${rot.toLowerCase()} · ${done.hora||''}</b><br>O sistema registra o fato (modo seguro). Conferência na Meta vem depois.</div>
      <button class="ghost" id="btnRedo">↺ Ver de novo</button>`;
    $('#btnRedo').onclick=()=>{VIEW='lista';render();};
    return;
  }

  if(!s){
    body.innerHTML=`<div class="empty">Sem base clara pra sugerir hoje.<br>Olhe as campanhas e volte amanhã.</div>
      <button class="ghost" id="btnVoltar">← Voltar</button>`;
    $('#btnVoltar').onclick=()=>{VIEW='lista';render();};
    return;
  }

  body.innerHTML=`
    <div class="sug">
      <div class="lab">Sugestão da IA</div>
      <div class="tit">${s.titulo}</div>
      <div class="mot">Motivo: ${s.motivo}</div>
    </div>
    <div class="actions">
      <button class="act ok" data-dec="aplicar"><span class="ic">✅</span><b>Aplicar</b><small>Registra — você aplica na Meta</small></button>
      <button class="act warn" data-dec="ajustar"><span class="ic">✎</span><b>Ajustar</b><small>Você decide o valor</small></button>
      <button class="act no" data-dec="agora-nao"><span class="ic">✕</span><b>Agora não</b><small>Registra que esperou</small></button>
    </div>
    <div class="valor">
      <label>Valor por dia — você decide</label>
      <input id="valDia" type="text" inputmode="numeric" placeholder="Digite quanto quiser · ex: R$ 80" value="${s.valorDia!=null?('R$ '+s.valorDia):''}">
    </div>
    <button class="ghost" id="btnVoltar2">← Voltar às campanhas</button>`;

  body.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click',()=>decidir(b.dataset.dec)));
  $('#btnVoltar2').onclick=()=>{VIEW='lista';render();};
}

async function decidir(decisao){
  const s=ST.sugestaoPrincipal;if(!s)return;
  let ajuste='';
  if(decisao==='ajustar'){
    ajuste=($('#valDia')&&$('#valDia').value||'').trim();
    if(!ajuste){toast('Digite o valor / o que ajustar');return;}
  } else if(decisao==='aplicar' && s.tipo==='mover' && s.valorDia!=null){
    ajuste=`mover R$${s.valorDia}/dia ${s.origem} → ${s.destino}`;
  }
  const r=await fetch('/api/placar-registrar',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({acao:'decisao',id:s.id,campanha:s.campanha,tipo:s.tipo||'mover',decisao,ajuste})
  }).then(x=>x.json()).catch(()=>({ok:false}));
  if(r.ok){toast('Registrado · Bruno avisado');VIEW='decisao';await load();}
  else toast(r.erro||'Não deu — tenta de novo');
}

function render(){
  if(!ST||!ST.ok)return;
  if(VIEW==='lista'){
    $('#cardCamp').classList.remove('hide');
    $('#cardDec').classList.add('hide');
    renderLista();
  } else {
    $('#cardCamp').classList.add('hide');
    $('#cardDec').classList.remove('hide');
    renderDecisao();
  }
}

$('#btnAbrir').addEventListener('click',()=>{VIEW='decisao';render();});
load();setInterval(()=>{if(VIEW==='lista')load();},20000);
</script>
</body>
</html>
