name: 📊 Placar do Michel — TESTE (Meta → WhatsApp)

# Puxa os números REAIS da Meta (últimos 7 dias) e envia o Placar no WhatsApp
# (via Z-API). Usa o cérebro novo `_placar.mjs` — leads reais (form + clique-pro-
# WhatsApp) + CPL + Decisão do dia. Conserta o "s/ dado" do placar antigo.
# Rodar pela aba Actions → "Run workflow" (escolhe quem recebe).
on:
  workflow_dispatch:
    inputs:
      para:
        description: "Quem recebe (separado por vírgula): ceo, carol, michel"
        default: "ceo,michel"
        required: true
      zapi_instance:
        description: "Z-API instance ID (opcional — se vazio usa o secret)"
        required: false
      zapi_token:
        description: "Z-API token da instância (opcional)"
        required: false
      zapi_client_token:
        description: "Z-API Client-Token da conta (opcional)"
        required: false
      carol_phone:
        description: "WhatsApp da Carol (opcional — se vazio usa o secret)"
        required: false

permissions:
  contents: read

jobs:
  placar:
    runs-on: ubuntu-latest
    env:
      META_TOKEN: ${{ secrets.META_SYSTEM_TOKEN }}
      AD_ACCOUNT: act_1150648749960943
      GRAPH: https://graph.facebook.com/v20.0
      ZAPI_INSTANCE: ${{ github.event.inputs.zapi_instance || secrets.ZAPI_INSTANCE }}
      ZAPI_TOKEN: ${{ github.event.inputs.zapi_token || secrets.ZAPI_TOKEN }}
      ZAPI_CLIENT_TOKEN: ${{ github.event.inputs.zapi_client_token || secrets.ZAPI_CLIENT_TOKEN }}
      WA_CEO: ${{ secrets.WHATSAPP_CEO }}
      WA_CAROL: ${{ github.event.inputs.carol_phone || secrets.WHATSAPP_CAROL }}
      WA_MICHEL: ${{ secrets.WHATSAPP_MICHEL }}
      PARA: ${{ github.event.inputs.para }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mascara segredos nos logs
        run: |
          for v in "$META_TOKEN" "$ZAPI_INSTANCE" "$ZAPI_TOKEN" "$ZAPI_CLIENT_TOKEN" "$WA_CEO" "$WA_CAROL" "$WA_MICHEL"; do
            [ -n "$v" ] && echo "::add-mask::$v" || true
          done

      - name: Confere as credenciais de envio (Z-API)
        run: |
          miss=""
          [ -z "$META_TOKEN" ] && miss="$miss META_SYSTEM_TOKEN"
          [ -z "$ZAPI_INSTANCE" ] && miss="$miss ZAPI_INSTANCE"
          [ -z "$ZAPI_TOKEN" ] && miss="$miss ZAPI_TOKEN"
          if [ -n "$miss" ]; then
            echo "::error::Faltam secrets no repo:${miss}. Crie em Settings → Secrets and variables → Actions."
            exit 1
          fi
          [ -z "$ZAPI_CLIENT_TOKEN" ] && echo "Aviso: sem ZAPI_CLIENT_TOKEN — vou tentar sem ele (se a Z-API exigir, aí criamos)."
          echo "Credenciais mínimas presentes ✅"

      - name: Puxa a Meta e monta o Placar (cérebro novo _placar.mjs)
        run: |
          set -euo pipefail
          curl -sS -G "${GRAPH}/${AD_ACCOUNT}/insights" \
            --data-urlencode "level=campaign" \
            --data-urlencode "date_preset=last_7d" \
            --data-urlencode "fields=campaign_name,spend,actions,results" \
            --data-urlencode "limit=500" \
            --data-urlencode "access_token=${META_TOKEN}" \
            -o /tmp/meta.json
          if jq -e '.error' /tmp/meta.json >/dev/null 2>&1; then
            echo "::error::Meta: $(jq -r '.error.message' /tmp/meta.json)"; exit 2
          fi
          node --input-type=module -e '
            import { montaPlacar, resumoPlacarWhats } from "./netlify/functions/_placar.mjs";
            import fs from "fs";
            const d = JSON.parse(fs.readFileSync("/tmp/meta.json","utf8")).data || [];
            const p = montaPlacar(d);
            fs.writeFileSync("/tmp/msg.txt", resumoPlacarWhats(p, { periodo: "últimos 7 dias" }));
          '
          echo "----- prévia -----"; cat /tmp/msg.txt; echo "------------------"

      - name: Envia no WhatsApp (Z-API)
        run: |
          set -euo pipefail
          MSG="$(cat /tmp/msg.txt)"
          declare -A MAP=( [ceo]="$WA_CEO" [carol]="$WA_CAROL" [michel]="$WA_MICHEL" )
          IFS=',' read -ra WHO <<< "$PARA"
          ANY=0
          for w in "${WHO[@]}"; do
            w="$(echo "$w" | tr -d '[:space:]')"
            PHONE="${MAP[$w]:-}"
            if [ -z "$PHONE" ]; then echo "· $w: sem número cadastrado — pulei"; continue; fi
            CT=()
            [ -n "$ZAPI_CLIENT_TOKEN" ] && CT=(-H "Client-Token: ${ZAPI_CLIENT_TOKEN}")
            CODE=$(curl -sS -o /tmp/z.json -w "%{http_code}" -X POST \
              "https://api.z-api.io/instances/${ZAPI_INSTANCE}/token/${ZAPI_TOKEN}/send-text" \
              "${CT[@]}" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg p "$PHONE" --arg m "$MSG" '{phone:$p, message:$m}')" || true)
            if echo "$CODE" | grep -q '^20'; then
              echo "· $w: enviado ✅ (HTTP $CODE)"; ANY=1
            else
              echo "· $w: FALHOU (HTTP $CODE) — $(jq -r '.error // .message // "sem detalhe"' /tmp/z.json 2>/dev/null || echo '?')"
            fi
          done
          [ "$ANY" = "1" ] || { echo "::error::Nada enviado — confere os números/credenciais."; exit 3; }
